<svg width="680" height="520" viewBox="0 0 680 520" xmlns="http://www.w3.org/2000/svg" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>SIEM Home Lab Architecture</title>
<desc>Kali attacker VM attacks linux-target and windows-target, which forward logs via Splunk Universal Forwarder to splunk-siem over port 9997; splunk-siem powers Splunk Web dashboards and alerts. All four VMs sit on an isolated host-only network, 192.168.56.0/24.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#5f5e5a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<rect x="55" y="45" width="570" height="430" rx="20" fill="none" stroke="#b4b2a9" stroke-width="1"/>
<text x="75" y="72" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#2c2c2a">Host-only network (VirtualBox)</text>
<text x="75" y="90" font-family="Arial, sans-serif" font-size="12" fill="#5f5e5a">192.168.56.0/24 &#183; isolated lab segment, no internet access</text>

<g>
<rect x="250" y="110" width="180" height="56" rx="8" fill="#faece7" stroke="#d85a30" stroke-width="1"/>
<text x="340" y="132" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#4a1b0c">kali-attacker</text>
<text x="340" y="150" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#712b13">192.168.56.50 &#183; Hydra, nmap</text>
</g>

<g>
<rect x="120" y="210" width="180" height="56" rx="8" fill="#e1f5ee" stroke="#1d9e75" stroke-width="1"/>
<text x="210" y="232" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#04342c">linux-target</text>
<text x="210" y="250" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#085041">192.168.56.20 &#183; UF, auth.log</text>
</g>

<g>
<rect x="380" y="210" width="180" height="56" rx="8" fill="#e1f5ee" stroke="#1d9e75" stroke-width="1"/>
<text x="470" y="232" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#04342c">windows-target</text>
<text x="470" y="250" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#085041">192.168.56.30 &#183; Sysmon, UF</text>
</g>

<g>
<rect x="250" y="310" width="180" height="56" rx="8" fill="#eeedfe" stroke="#7f77dd" stroke-width="1"/>
<text x="340" y="332" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#26215c">splunk-siem</text>
<text x="340" y="350" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#3c3489">192.168.56.10 &#183; port 9997</text>
</g>

<g>
<rect x="250" y="410" width="180" height="56" rx="8" fill="#f1efe8" stroke="#888780" stroke-width="1"/>
<text x="340" y="432" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#2c2c2a">Splunk Web</text>
<text x="340" y="450" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#444441">Dashboards, alerts, searches</text>
</g>

<line x1="300" y1="166" x2="225" y2="208" stroke="#5f5e5a" stroke-width="1" marker-end="url(#arrow)"/>
<line x1="380" y1="166" x2="455" y2="208" stroke="#5f5e5a" stroke-width="1" marker-end="url(#arrow)"/>
<line x1="235" y1="266" x2="300" y2="308" stroke="#5f5e5a" stroke-width="1" marker-end="url(#arrow)"/>
<line x1="445" y1="266" x2="380" y2="308" stroke="#5f5e5a" stroke-width="1" marker-end="url(#arrow)"/>
<line x1="340" y1="366" x2="340" y2="408" stroke="#5f5e5a" stroke-width="1" marker-end="url(#arrow)"/>

<text x="130" y="195" font-family="Arial, sans-serif" font-size="11" fill="#5f5e5a">attacks</text>
<text x="460" y="195" font-family="Arial, sans-serif" font-size="11" fill="#5f5e5a">attacks</text>
<text x="240" y="295" font-family="Arial, sans-serif" font-size="11" fill="#5f5e5a">logs</text>
<text x="420" y="295" font-family="Arial, sans-serif" font-size="11" fill="#5f5e5a">logs</text>

<rect x="55" y="485" width="570" height="26" rx="6" fill="#f1efe8" stroke="#d3d1c7" stroke-width="1"/>
<text x="70" y="502" font-family="Arial, sans-serif" font-size="11" fill="#444441">Each VM also has a separate NAT adapter (not shown) for internet access to install packages.</text>
</svg>
